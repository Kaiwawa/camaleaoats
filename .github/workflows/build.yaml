name: Build Image

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: camaleao:${{ env.IMAGE_TAG }}

     - name: Save Docker Image
       run: |
         docker save camaleao:${{ env.IMAGE_TAG }} -o ./trabalho-1-${{ env.IMAGE_TAG }}.tar

     - name: Generate SBOM CycloneDX
       uses: aquasecurity/trivy-action@v0.36.0
       with:
         input: ./camaleao-${{ env.IMAGE_TAG }}.tar
         format: 'cyclonedx'
         output: 'sbom.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom.json
          retention-days: 1

      - name: Tag and Push Image to Registry
        run: |
          docker tag camaleao:${{ env.IMAGE_TAG }} ${{ env.IMAGE_REF }}
          docker push ${{ env.IMAGE_REF }}
