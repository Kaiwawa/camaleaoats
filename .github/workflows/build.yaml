name: Build & Push Image with SBOM

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History for Commit Count Versioning)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compute Version (0.<commit_count>) and Image Tags
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_TAG="0.${COMMIT_COUNT}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "IMAGE_NAME=${IMAGE_LOWER}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${{ env.REGISTRY }}/${IMAGE_LOWER}:${VERSION_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${{ env.REGISTRY }}/${IMAGE_LOWER}:sha-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${{ env.REGISTRY }}/${IMAGE_LOWER}:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Docker Image for SBOM Scan
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: camaleao:${{ env.IMAGE_TAG }}

      - name: Save Docker Image Tarball
        run: |
          docker save camaleao:${{ env.IMAGE_TAG }} -o ./camaleao-${{ env.IMAGE_TAG }}.tar

      - name: Generate SBOM CycloneDX (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ./camaleao-${{ env.IMAGE_TAG }}.tar
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-v${{ env.VERSION_TAG }}-${{ github.sha }}
          path: ./sbom.json
          retention-days: 30

      - name: Build and Push Image + SBOM Attestation to GHCR
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_LATEST }}
            ${{ env.IMAGE_SHA }}
