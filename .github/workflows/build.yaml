name: Build & Push Image with SBOM

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize Image Name to Lowercase
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_LOWER}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${{ env.REGISTRY }}/${IMAGE_LOWER}:${{ env.IMAGE_TAG }}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${{ env.REGISTRY }}/${IMAGE_LOWER}:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Local Docker Image for SBOM Scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: camaleao:${{ env.IMAGE_TAG }}

      - name: Save Docker Image Tarball
        run: |
          docker save camaleao:${{ env.IMAGE_TAG }} -o ./camaleao-${{ env.IMAGE_TAG }}.tar

      - name: Generate SBOM CycloneDX (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: ./camaleao-${{ env.IMAGE_TAG }}.tar
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ./sbom.json
          retention-days: 30

      - name: Build and Push Image + SBOM Attestation to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_LATEST }}
